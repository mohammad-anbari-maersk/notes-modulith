spring.application.name=notes-modulith
server.port=8081
server.servlet.context-path=/api
spring.mvc.problemdetails.enabled=true

#### App Config ####
app.rabbitmq.exchange=notes.exchange
app.rabbitmq.routing-key=notes.new
app.rabbitmq.queue=new-notes

#### Database Config ####
# Use Testcontainers @ServiceConnection-provided datasource
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=validate

# Schema is owned by Flyway; db/sample-data seeds demo users and notes once.
spring.flyway.locations=classpath:db/migration,classpath:db/sample-data

#### RabbitMQ Config ####
# Use Testcontainers @ServiceConnection-provided RabbitMQ connection

#### Events Config ######
spring.modulith.events.jdbc.schema=events
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true
#spring.modulith.events.completion-mode=delete
